<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | LegalEase AI</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container header-wrapper">
            <div class="logo-container">
                <a href="index.html" class="logo-link">
                    <img src="images/logo2.png" alt="LegalEase AI Logo" class="logo-img">
                    <h1 class="logo-text">Lawyer Erëmira Halimi-Hamidi</h1>
                </a>
            </div>
        </div>
    </header>

    <section class="admin-login-section container">
        <div class="admin-login-card">
            <h2>Admin Login</h2>
            <p>Sign in to manage consultation requests and contact messages.</p>

            <div id="loginError" class="form-error"></div>

            <form id="adminLoginForm" novalidate>
                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <input id="adminUsername" name="username" type="text" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
                </div>

                <button id="loginSubmitBtn" class="form-submit" type="submit">Log In</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="container footer-container">
            <div class="footer-left">
                <h3>⚖️ Lawyer Erëmira Halimi-Hamidi</h3>
                <p>Empowering clients with modern, intelligent legal services.</p>
            </div>
        </div>
        <p class="copyright">© 2025 LegalEase AI | All Rights Reserved</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
